# Application properties
# All sensitive values are read from environment variables — no secrets here.

spring.application.name=github-copilot-capstone
server.port=${PORT:${APP_PORT:8080}}

# Database — connection details from env vars
spring.datasource.url=${DB_URL:jdbc:h2:mem:capstonedb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console (dev only — disable in production via APP_ENV)
spring.h2.console.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging — never log secrets
logging.level.root=INFO
logging.level.com.capstone=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
