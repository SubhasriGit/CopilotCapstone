# Application properties
# All sensitive values are read from environment variables — no secrets here.

spring.application.name=github-copilot-capstone
server.port=${PORT:${APP_PORT:8080}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Database — connection details from env vars
spring.datasource.url=${DB_URL:jdbc:h2:mem:capstonedb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sa}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console (disable by default; enable explicitly for local debugging only)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# Actuator and health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Logging — console output is collected by Render logs
logging.level.root=INFO
logging.level.com.capstone=${APP_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n