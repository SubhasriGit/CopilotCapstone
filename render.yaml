# render.yaml — Render Infrastructure as Code
# Docs: https://render.com/docs/infrastructure-as-code
# Production deploys are triggered by GitHub Actions after manual environment approval.

services:
  - type: web
    name: officecheck-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    branch: main
    autoDeploy: false
    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: 8080
      - key: DB_URL
        fromDatabase:
          name: officecheck-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: officecheck-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: officecheck-db
          property: password
      - key: EXTERNAL_API_URL
        sync: false
      - key: EXTERNAL_API_KEY
        sync: false
      - key: RETRY_MAX_ATTEMPTS
        value: '3'
      - key: RETRY_BASE_DELAY_MS
        value: '1000'
      - key: CB_FAILURE_THRESHOLD
        value: '3'
      - key: CB_RESET_TIMEOUT_MS
        value: '30000'

      # Render streams stdout/stderr automatically to service logs.

databases:
  - name: officecheck-db
    region: singapore
    plan: free
    databaseName: officecheck
    user: officecheck_user