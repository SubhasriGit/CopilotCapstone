name: OfficeCheck CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: officecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  APP_BASE_URL: https://officecheck-api.onrender.com
  APP_PORT: '8080'
  APP_ENV: production

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and package JAR
        run: mvn -B -ntp clean install -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: officecheck-jar
          path: target/*.jar
          if-no-files-found: error

  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests with JaCoCo coverage
        run: mvn -B -ntp verify

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: officecheck-test-artifacts
          path: |
            target/surefire-reports/**
            target/site/jacoco/**
          if-no-files-found: warn

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Scan for hardcoded secrets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- 'src/main/**' '.github/workflows/**' 'deployment/*.sh' 'Dockerfile' 'render.yaml' 'pom.xml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No files selected for secret scan."
            exit 1
          fi

          patterns=(
            'password\s*[:=]\s*["'"'"'][^"'"'"'$]+["'"'"']'
            'secret\s*[:=]\s*["'"'"'][^"'"'"'$]+["'"'"']'
            'token\s*[:=]\s*["'"'"'][^"'"'"'$]+["'"'"']'
            'api[_-]?key\s*[:=]\s*["'"'"'][^"'"'"'$]+["'"'"']'
            'ghp_[A-Za-z0-9]{36}'
            'sk-[A-Za-z0-9]{20,}'
            '-----BEGIN (RSA|EC|OPENSSH)? ?PRIVATE KEY-----'
          )

          found=0
          for pattern in "${patterns[@]}"; do
            if grep -RInE --color=never -- "$pattern" "${files[@]}"; then
              found=1
            fi
          done

          if [ "$found" -ne 0 ]; then
            echo "Hardcoded secret patterns detected. Failing workflow."
            exit 1
          fi

          echo "Secret scan passed."

      - name: Run dependency vulnerability check
        run: mvn -B -ntp org.owasp:dependency-check-maven:check -Dformat=HTML -Dformat=JSON -DfailBuildOnCVSS=7

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: officecheck-security-artifacts
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs:
      - test
      - security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://officecheck-api.onrender.com
    outputs:
      deploy_id: ${{ steps.poll.outputs.deploy_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download packaged JAR
        uses: actions/download-artifact@v4
        with:
          name: officecheck-jar
          path: target

      - name: Validate deployment secrets
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          for secret_name in RENDER_DEPLOY_HOOK_URL RENDER_API_KEY RENDER_SERVICE_ID; do
            if [ -z "${!secret_name:-}" ]; then
              echo "$secret_name is required for Render deployment."
              exit 1
            fi
          done
          ls -1 target/*.jar >/dev/null

      - name: Trigger Render deployment
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o render-deploy-response.json -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK_URL")
          cat render-deploy-response.json
          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            echo "Render deploy hook failed with HTTP $http_code."
            exit 1
          fi

      - name: Wait for Render deployment
        id: poll
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          deploy_id=""
          for attempt in $(seq 1 40); do
            curl -fsS \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=5" \
              -o render-deploy-status.json

            deploy_info=$(python -c "import json,sys; data=json.load(open('render-deploy-status.json')); items=data.get('items', data) if isinstance(data, dict) else data; items=items if isinstance(items, list) else [items]; deploy=(items[0].get('deploy', items[0]) if items else {}); print(f'{deploy.get(\"id\", \"\")}|{deploy.get(\"status\", \"unknown\")}')")
            deploy_id="${deploy_info%%|*}"
            status="${deploy_info##*|}"
            echo "Attempt $attempt: deploy ${deploy_id:-unknown} status=$status"

            case "$status" in
              live|deployed|deploy_live|succeeded)
                echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              build_failed|update_failed|failed|canceled|cancelled)
                echo "Render deployment failed with status $status."
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "Timed out waiting for Render deployment to become live."
          exit 1

  smoke_test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Run deployment smoke tests
        shell: bash
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL:-${APP_BASE_URL}}"
          health_ok=0
          start_time=$(date +%s)

          while [ $(( $(date +%s) - start_time )) -lt 30 ]; do
            http_code=$(curl -sS -o health-response.json -w '%{http_code}' "$APP_URL/health" || true)
            if [ "$http_code" = "200" ]; then
              health_ok=1
              break
            fi
            sleep 5
          done

          if [ "$health_ok" -ne 1 ]; then
            [ -f health-response.json ] && cat health-response.json || true
            echo "Health endpoint failed to return 200 within 30 seconds."
            exit 1
          fi

          python -c "import json; data=json.load(open('health-response.json')); assert data.get('status') == 'UP', data; print('Health payload validated.')"

          entities_code=$(curl -sS -o entities-response.json -w '%{http_code}' "$APP_URL/api/v1/entities" || true)
          if [ "$entities_code" != "200" ]; then
            [ -f entities-response.json ] && cat entities-response.json || true
            echo "Primary API endpoint check failed with HTTP $entities_code."
            exit 1
          fi

          visitors_code=$(curl -sS -o visitors-response.json -w '%{http_code}' "$APP_URL/api/visitors" || true)
          case "$visitors_code" in
            200|204|401|403)
              echo "Optional /api/visitors endpoint is reachable (HTTP $visitors_code)."
              ;;
            404)
              echo "Optional /api/visitors endpoint is not implemented; skipping."
              ;;
            *)
              [ -f visitors-response.json ] && cat visitors-response.json || true
              echo "Unexpected response from optional /api/visitors endpoint: HTTP $visitors_code."
              exit 1
              ;;
          esac

          rm -f health-response.json entities-response.json visitors-response.json

  rollback:
    name: Roll back Render deployment
    runs-on: ubuntu-latest
    needs:
      - deploy
      - smoke_test
    if: always() && needs.deploy.result == 'success' && needs.smoke_test.result == 'failure' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Roll back to previous Render deploy
        shell: bash
        env:
          CURRENT_DEPLOY_ID: ${{ needs.deploy.outputs.deploy_id }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=10" \
            -o render-deploys.json

          rollback_id=$(python -c "import json; data=json.load(open('render-deploys.json')); items=data.get('items', data) if isinstance(data, dict) else data; items=items if isinstance(items, list) else [items]; current='$CURRENT_DEPLOY_ID'; ids=[]; [ids.append((item.get('deploy', item).get('id') or item.get('id'))) for item in items if (item.get('deploy', item).get('id') or item.get('id'))]; print(next((i for i in ids if i and i != current), ''))")

          if [ -z "$rollback_id" ]; then
            echo "Unable to determine previous deploy ID. Manual rollback required in Render dashboard."
            exit 1
          fi

          curl -fsS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$rollback_id/rollback"

          echo "Rollback triggered for deploy $rollback_id."